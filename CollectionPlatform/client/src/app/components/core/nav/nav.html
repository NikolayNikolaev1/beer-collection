<mat-toolbar class="topbar"
  ><span class="brand-mark">{{ 'nav.brand' | translate }}<span>{{ 'nav.brandAccent' | translate }}</span></span
  ><span class="toolbar-spacer"></span>
  @if (auth.isAuthenticated()) {
    <button mat-button (click)="profile()">{{ 'nav.profile' | translate }}</button>
    <button mat-button (click)="auth.logout()">{{ 'nav.signOut' | translate }}</button>
  }
  <span class="language-label">{{ 'nav.languageLabel' | translate }}</span>
  <button mat-button [class.active-language]="languageService.language() === 'en'" (click)="setLanguage('en')">{{ 'nav.english' | translate }}</button>
  <button mat-button [class.active-language]="languageService.language() === 'bg'" (click)="setLanguage('bg')">{{ 'nav.bulgarian' | translate }}</button>
</mat-toolbar>
